```html
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>AI Chat</title>

	<style>
		:root {
			--primary: #f6821f;
			--primary-hover: #e87512;

			--bg: #0b0d10;
			--surface: #111418;
			--surface-2: #171b20;
			--border: #252a31;

			--text: #f3f4f6;
			--text-muted: #8b929c;

			--user-bg: #f6821f;
			--assistant-bg: #181c21;

			--radius: 16px;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Helvetica,
				Arial,
				sans-serif;

			background:
				radial-gradient(
					circle at top,
					rgba(246, 130, 31, 0.08),
					transparent 35%
				),
				var(--bg);

			color: var(--text);
			overflow: hidden;
		}

		/* =========================
		   APP
		========================= */

		.app {
			width: 100%;
			height: 100vh;

			display: flex;
			flex-direction: column;
		}

		/* =========================
		   HEADER
		========================= */

		header {
			height: 70px;
			flex-shrink: 0;

			display: flex;
			align-items: center;
			justify-content: space-between;

			padding: 0 24px;

			border-bottom: 1px solid var(--border);
			background: rgba(11, 13, 16, 0.85);

			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.logo {
			width: 38px;
			height: 38px;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 12px;

			background: linear-gradient(
				135deg,
				var(--primary),
				#ff9d4d
			);

			color: white;
			font-size: 19px;
			font-weight: 700;

			box-shadow:
				0 8px 25px rgba(246, 130, 31, 0.2);
		}

		.brand-text h1 {
			font-size: 16px;
			font-weight: 650;
			letter-spacing: -0.2px;
		}

		.brand-text p {
			margin-top: 2px;

			font-size: 11px;
			color: var(--text-muted);
		}

		.status {
			display: flex;
			align-items: center;
			gap: 7px;

			font-size: 12px;
			color: var(--text-muted);
		}

		.status-dot {
			width: 7px;
			height: 7px;

			border-radius: 50%;
			background: #42d392;

			box-shadow: 0 0 10px rgba(66, 211, 146, 0.6);
		}

		/* =========================
		   MAIN CHAT
		========================= */

		.chat-wrapper {
			flex: 1;

			width: 100%;
			max-width: 920px;

			margin: 0 auto;

			display: flex;
			flex-direction: column;

			min-height: 0;
		}

		.chat-container {
			flex: 1;

			display: flex;
			flex-direction: column;

			min-height: 0;

			border-left: 1px solid rgba(255, 255, 255, 0.025);
			border-right: 1px solid rgba(255, 255, 255, 0.025);
		}

		/* =========================
		   MESSAGES
		========================= */

		.chat-messages {
			flex: 1;

			overflow-y: auto;

			padding: 32px 24px 20px;

			scroll-behavior: smooth;
		}

		.chat-messages::-webkit-scrollbar {
			width: 6px;
		}

		.chat-messages::-webkit-scrollbar-track {
			background: transparent;
		}

		.chat-messages::-webkit-scrollbar-thumb {
			background: #292e35;
			border-radius: 10px;
		}

		.message {
			display: flex;
			flex-direction: column;

			width: fit-content;
			max-width: min(78%, 680px);

			margin-bottom: 18px;

			padding: 13px 16px;

			border-radius: var(--radius);

			font-size: 14px;
			line-height: 1.65;

			animation: messageIn 0.2s ease-out;
		}

		@keyframes messageIn {
			from {
				opacity: 0;
				transform: translateY(5px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message p {
			white-space: pre-line;
			overflow-wrap: anywhere;
		}

		.user-message {
			margin-left: auto;

			background: var(--user-bg);
			color: white;

			border-bottom-right-radius: 5px;

			box-shadow:
				0 8px 25px rgba(246, 130, 31, 0.12);
		}

		.assistant-message {
			margin-right: auto;

			background: var(--assistant-bg);

			border: 1px solid var(--border);

			color: var(--text);

			border-bottom-left-radius: 5px;
		}

		/* =========================
		   TYPING
		========================= */

		.typing-indicator {
			display: none;

			align-items: center;
			gap: 5px;

			width: fit-content;

			margin: 0 24px 12px;
			padding: 10px 14px;

			border-radius: 12px;

			background: var(--assistant-bg);
			border: 1px solid var(--border);

			color: var(--text-muted);

			font-size: 12px;
		}

		.typing-indicator.visible {
			display: flex;
		}

		.typing-indicator::after {
			content: "";

			width: 5px;
			height: 5px;

			border-radius: 50%;

			background: var(--primary);

			box-shadow:
				8px 0 0 rgba(246, 130, 31, 0.6),
				16px 0 0 rgba(246, 130, 31, 0.3);

			animation: dots 1.2s infinite;
		}

		@keyframes dots {
			0% {
				opacity: 0.3;
			}

			50% {
				opacity: 1;
			}

			100% {
				opacity: 0.3;
			}
		}

		/* =========================
		   INPUT
		========================= */

		.message-input {
			padding: 12px 18px 18px;

			background:
				linear-gradient(
					to top,
					var(--bg) 75%,
					transparent
				);
		}

		.input-box {
			display: flex;
			align-items: flex-end;

			padding: 8px;

			background: var(--surface);

			border: 1px solid var(--border);

			border-radius: 18px;

			box-shadow:
				0 12px 35px rgba(0, 0, 0, 0.25);

			transition:
				border-color 0.2s,
				box-shadow 0.2s;
		}

		.input-box:focus-within {
			border-color: rgba(246, 130, 31, 0.55);

			box-shadow:
				0 0 0 3px rgba(246, 130, 31, 0.08),
				0 12px 35px rgba(0, 0, 0, 0.25);
		}

		#user-input {
			flex: 1;

			width: 100%;

			padding: 11px 12px;

			background: transparent;

			border: none;
			outline: none;

			color: var(--text);

			font-family: inherit;
			font-size: 14px;

			line-height: 1.5;

			resize: none;

			min-height: 44px;
			max-height: 150px;
		}

		#user-input::placeholder {
			color: #666d76;
		}

		/* =========================
		   SEND BUTTON
		========================= */

		#send-button {
			width: 42px;
			height: 42px;

			flex-shrink: 0;

			display: flex;
			align-items: center;
			justify-content: center;

			margin-left: 5px;

			background: var(--primary);

			color: white;

			border: none;
			border-radius: 13px;

			cursor: pointer;

			font-size: 0;

			transition:
				transform 0.15s,
				background 0.2s,
				opacity 0.2s;
		}

		#send-button::before {
			content: "↑";

			font-size: 21px;
			font-weight: 500;

			line-height: 1;
		}

		#send-button:hover {
			background: var(--primary-hover);
			transform: translateY(-1px);
		}

		#send-button:active {
			transform: scale(0.95);
		}

		#send-button:disabled {
			background: #343941;
			color: #777e87;

			cursor: not-allowed;

			transform: none;
		}

		/* =========================
		   FOOTER
		========================= */

		footer {
			text-align: center;

			padding: 0 0 12px;

			font-size: 10px;

			color: #555c65;
		}

		/* =========================
		   MOBILE
		========================= */

		@media (max-width: 600px) {

			header {
				height: 62px;

				padding: 0 15px;
			}

			.logo {
				width: 34px;
				height: 34px;

				border-radius: 10px;
			}

			.brand-text h1 {
				font-size: 14px;
			}

			.brand-text p {
				font-size: 10px;
			}

			.status {
				font-size: 10px;
			}

			.chat-messages {
				padding: 22px 14px 15px;
			}

			.message {
				max-width: 88%;

				padding: 11px 13px;

				font-size: 13px;

				border-radius: 14px;
			}

			.typing-indicator {
				margin-left: 14px;
				margin-right: 14px;
			}

			.message-input {
				padding: 8px 10px 10px;
			}

			.input-box {
				border-radius: 16px;
			}

			#user-input {
				font-size: 13px;
			}

			#send-button {
				width: 40px;
				height: 40px;

				border-radius: 12px;
			}

			footer {
				display: none;
			}
		}
	</style>
</head>

<body>

	<div class="app">

		<!-- Header -->
		<header>

			<div class="brand">

				<div class="logo">
					✦
				</div>

				<div class="brand-text">
					<h1>AI Assistant</h1>
					<p>Powered by Cloudflare Workers AI</p>
				</div>

			</div>

			<div class="status">
				<span class="status-dot"></span>
				Online
			</div>

		</header>


		<!-- Chat -->
		<main class="chat-wrapper">

			<div class="chat-container">

				<div
					id="chat-messages"
					class="chat-messages"
				>

					<div class="message assistant-message">

						<p>
							Hello! 👋

							I'm your AI assistant powered by Cloudflare Workers AI.

							How can I help you today?
						</p>

					</div>

				</div>


				<div
					class="typing-indicator"
					id="typing-indicator"
				>
					AI is thinking
				</div>


				<!-- Input -->
				<div class="message-input">

					<div class="input-box">

						<textarea
							id="user-input"
							placeholder="Message AI..."
							rows="1"
							autofocus
						></textarea>

						<button
							id="send-button"
							aria-label="Send message"
						>
							Send
						</button>

					</div>

				</div>

			</div>

		</main>


		<footer>
			Cloudflare Workers AI
		</footer>

	</div>


	<!-- Chat app script -->
	<script src="chat.js"></script>

</body>
</html>
```
